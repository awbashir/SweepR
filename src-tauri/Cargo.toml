[package]
name = "sweepr"
version = "0.1.0"
description = "SweepR - IPv4/IPv6 enterprise network scanner with 802.1Q VLAN and switch/firewall/AP discovery"
authors = ["Bashir Awbashir"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
default-run = "sweepr"

# `sweepr-core`: the shared scan engine. Both the clap CLI and the Tauri GUI drive this library
# from the single `sweepr` binary below.
[lib]
name = "sweepr_core"
path = "src/lib.rs"

[[bin]]
name = "sweepr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# --- GUI shell (Tauri v2) ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# --- Async runtime & CLI ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
comfy-table = "8"

# --- Packet engine ---
pnet = "0.35"
pcap = "2"
socket2 = { version = "0.6", features = ["all"] }
surge-ping = "0.9"
libc = "0.2"

# --- Infrastructure discovery & enrichment ---
# `heap_buffers` moves snmp2's two 64 KiB per-session scratch buffers off the stack onto the
# heap, so polling many devices concurrently cannot overflow a worker thread's stack.
snmp2 = { version = "0.5", features = ["heap_buffers"] }
hickory-resolver = "0.26"
mdns-sd = "0.21"

# --- Export ---
csv = "1"
rust_xlsxwriter = "0.99"

# --- Serialization, errors, logging, persistence ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic = "abort" is deliberately not set: with unwinding, a panic inside one scan task is
# caught by tokio and reported, instead of killing the whole GUI process.
strip = true
