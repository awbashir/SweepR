[package]
name = "sweepr"
version = "0.1.0"
description = "SweepR - IPv4/IPv6 enterprise network scanner with 802.1Q VLAN and switch/firewall/AP discovery"
authors = ["Bashir Awbashir"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
default-run = "sweepr"

# `sweepr-core`: the shared scan engine. Both the clap CLI and the Tauri GUI drive this library
# from the single `sweepr` binary below.
[lib]
name = "sweepr_core"
path = "src/lib.rs"

[[bin]]
name = "sweepr"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Embed ../dist and serve it via the tauri:// protocol. Without it a debug binary loads devUrl
# (http://localhost:1420), i.e. it expects `npm run dev` to be running. `tauri build` enables it.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# --- GUI shell (Tauri v2) ---
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# --- Async runtime & CLI ---
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs", "process"] }
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
comfy-table = "8"

# --- Packet engine ---
pnet = "0.35"
pcap = "2"
socket2 = { version = "0.6", features = ["all"] }
surge-ping = "0.9"
libc = "0.2"

# --- Infrastructure discovery & enrichment ---
# `heap_buffers` moves snmp2's two 64 KiB per-session scratch buffers off the stack onto the
# heap, so polling many devices concurrently cannot overflow a worker thread's stack.
snmp2 = { version = "0.5", features = ["heap_buffers"] }
hickory-resolver = "0.26"
mdns-sd = "0.21"
# Hardened XML pull parser for SSDP/UPnP device descriptions and WS-Discovery / ONVIF SOAP.
# Default features only: no DTD / external-entity / general-entity expansion, so a hostile
# device description cannot trigger entity-expansion ("billion laughs") attacks.
quick-xml = "0.42"

# --- Network utilities (web identity / TLS certificate grabber) ---
# rustls with the `ring` provider only (no aws-lc / cmake toolchain needed). The grabber uses a
# verifier that accepts any certificate *only* to read it; see `webid.rs`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
x509-parser = { version = "0.18", features = ["verify"] }
ring = "0.17"
httparse = "1"

# --- Export ---
csv = "1"
# rust_xlsxwriter 0.99 needs `zip` ^8.3, and every zip 8.x release is yanked on crates.io. The
# committed Cargo.lock (zip 8.6.0) is what makes the build resolve: keep Cargo.lock committed,
# build with `--locked`, and update dependencies selectively (`cargo update -p <crate>`); a
# bare `cargo update` or a lockfile-less build fails. An exact `zip = "=8.6.0"` pin would not
# help: cargo never selects a yanked version for a new lockfile, even with `=`. Drop this note
# once rust_xlsxwriter moves to zip 9.
rust_xlsxwriter = "0.99"

# --- Audit report (HTML / PDF) ---
pdf-writer = "0.15"
png = "0.17"
miniz_oxide = "0.8"
sha2 = "0.10"
base64 = "0.22"

# --- Serialization, errors, logging, persistence ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"

# --- Windows port ---
# Win32 APIs used instead of the Unix tools / syscalls: adapter enumeration (GetAdaptersAddresses),
# ICMP echo without Administrator rights (IcmpSendEcho / Icmp6SendEcho2), token elevation,
# loading Npcap from System32\Npcap, NIC VLAN IDs from the registry, console handling.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# panic = "abort" is deliberately not set: with unwinding, a panic inside one scan task is
# caught by tokio and reported, instead of killing the whole GUI process.
strip = true
