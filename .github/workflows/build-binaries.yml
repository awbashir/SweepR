name: Build binaries

# Builds the single `sweepr` binary (CLI + GUI, frontend embedded) for macOS (Apple Silicon
# and universal), Linux (x86_64, aarch64) and Windows (x86_64), runs the test suites, and
# uploads one archive per platform plus SHA256SUMS as workflow artifacts.
#
# Releases: pushing a `v*` tag that matches the version in src-tauri/Cargo.toml (e.g. v0.1.0),
# or running the workflow by hand with `release` set to such a tag, also publishes the
# archives as a GitHub release (the tag is created on the built commit if it does not exist).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release for this tag (e.g. v0.1.0); empty = build only"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Import libraries for Npcap's wpcap.dll / Packet.dll (Windows link step only).
  NPCAP_SDK_VERSION: "1.16"
  NPCAP_SDK_SHA256: f0a8be7778ee3ae1b99bbbecb27a3ff0f6c111a4093f1c78c5c5a099607184db
  # libpcap version Npcap is based on (enables the pcap crate's 1.5+ APIs at compile time).
  NPCAP_LIBPCAP_VER: "1.10.5"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            os: macos-latest
            targets: aarch64-apple-darwin
            test: true
          - platform: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            test: false # same code and runner as macos-arm64
          - platform: linux-x86_64
            os: ubuntu-22.04 # glibc 2.35: runs on Ubuntu 22.04+, Debian 12+, RHEL 10, ...
            targets: x86_64-unknown-linux-gnu
            test: true
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
            test: true
          - platform: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            test: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::tag ${GITHUB_REF#refs/tags/} does not match src-tauri/Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Linux build dependencies (Tauri v2 + libpcap)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libpcap-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Npcap SDK (Windows import libraries)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-$env:NPCAP_SDK_VERSION.zip" -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:NPCAP_SDK_SHA256) { throw "Npcap SDK checksum mismatch: $hash" }
          $sdk = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Expand-Archive -Path $zip -DestinationPath $sdk -Force
          $lib = Join-Path $sdk "Lib\x64"
          if (-not (Test-Path (Join-Path $lib "wpcap.lib"))) { throw "wpcap.lib missing in $lib" }
          "LIBPCAP_LIBDIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBPCAP_VER=$env:NPCAP_LIBPCAP_VER" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Frontend
        run: |
          npm ci
          npm run build

      - name: Frontend tests
        if: matrix.platform == 'linux-x86_64'
        run: npm test

      - name: Build
        working-directory: src-tauri
        run: |
          if [ "${{ matrix.platform }}" = macos-universal ]; then
            cargo build --release --locked --features custom-protocol --target aarch64-apple-darwin
            cargo build --release --locked --features custom-protocol --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/sweepr \
              target/aarch64-apple-darwin/release/sweepr target/x86_64-apple-darwin/release/sweepr
            echo "BIN=src-tauri/target/universal-apple-darwin/release/sweepr" >> "$GITHUB_ENV"
          else
            cargo build --release --locked --features custom-protocol
            exe=sweepr
            if [ "$RUNNER_OS" = Windows ]; then exe=sweepr.exe; fi
            echo "BIN=src-tauri/target/release/$exe" >> "$GITHUB_ENV"
          fi

      - name: Ad-hoc code signature (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --sign - --force "$BIN"
          codesign --verify --verbose "$BIN"
          lipo -info "$BIN"

      - name: Tests
        if: matrix.test
        working-directory: src-tauri
        run: cargo test --locked

      - name: Smoke test
        run: |
          "$BIN" --version
          "$BIN" --help > /dev/null
          # Lists interfaces without privileges (Windows: without Npcap) and must not crash.
          "$BIN" interfaces
          if [ "${{ matrix.platform }}" = macos-universal ]; then
            if arch -x86_64 /usr/bin/true 2> /dev/null; then
              arch -x86_64 "$BIN" --version
            else
              echo "Rosetta not available; x86_64 slice not executed"
            fi
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$BIN" | grep -E 'pcap|webkit2gtk|gtk-3'
            objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n 1
          fi

      - name: Package
        run: |
          archive="$(scripts/package-binary.sh "$VERSION" "${{ matrix.platform }}" "$BIN" dist-bin)"
          echo "built $archive"
          ls -l dist-bin

      - uses: actions/upload-artifact@v7
        with:
          name: sweepr-${{ matrix.platform }}
          path: dist-bin/*
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sweepr-*
          path: dist-bin
          merge-multiple: true
      - name: Checksums
        working-directory: dist-bin
        run: |
          sha256sum -c ./*.sha256
          cat ./*.sha256 | sort -k 2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: SHA256SUMS
          path: dist-bin/SHA256SUMS
          if-no-files-found: error

  release:
    name: GitHub release
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Check the tag
        env:
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::release tag must look like v0.1.0 (got $TAG)"; exit 1 ;; esac
          ls -l release
          found=0
          for f in release/sweepr-"${TAG#v}"-*; do
            if [ -f "$f" ]; then found=1; fi
          done
          if [ "$found" = 0 ]; then
            echo "::error::no archives for version ${TAG#v} (the tag must match src-tauri/Cargo.toml)"
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: SweepR ${{ inputs.release || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/SHA256SUMS
