name: macOS DMG

# Builds the universal (Apple Silicon + Intel) installer disk image. Run it by hand from the
# Actions tab, or push a `v*` tag to also attach the image to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build the disk image
        run: packaging/macos/build-dmg.sh
        env:
          SWEEPR_TARGET: universal-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: SweepR-macOS
          path: src-tauri/target/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/dmg/*.dmg
